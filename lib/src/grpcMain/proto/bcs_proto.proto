syntax = "proto3";

package sui.rpc.v2;

option java_package = "sui.rpc.v2";
option java_outer_classname = "BcsProto";

message Bcs {
  // Name that identifies the type of the serialized value.
  optional string name = 1;

  // Bytes of a BCS serialized value.
  optional bytes value = 2;
}
