syntax = "proto3";

package sui.rpc.v2;

option java_package = "sui.rpc.v2";
option java_outer_classname = "DurationProto";

// Local duration replacement for gRPC models.
message Duration {
  // Signed seconds of the span of time.
  optional int64 seconds = 1;

  // Nanosecond fractions of a second, must be from 0 to 999,999,999.
  optional int32 nanos = 2;
}
