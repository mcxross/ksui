<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ksui API Documentation</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2933;
        background: #f7f9fb;
      }
      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 48px 24px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 36px;
        font-weight: 700;
      }
      p {
        margin: 0 0 28px;
        color: #52606d;
        line-height: 1.6;
      }
      ul {
        display: grid;
        gap: 12px;
        padding: 0;
        margin: 0;
        list-style: none;
      }
      a {
        display: block;
        padding: 16px 18px;
        border: 1px solid #d9e2ec;
        border-radius: 8px;
        color: #102a43;
        background: #ffffff;
        text-decoration: none;
      }
      a:hover {
        border-color: #627d98;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ksui API Documentation</h1>
      <p>Select a module. Each section is generated from the module that owns that API surface.</p>
      <ul>
        <li><a href="core/">Ksui Core</a></li>
        <li><a href="graphql/">Ksui GraphQL</a></li>
        <li><a href="grpc/">Ksui gRPC</a></li>
      </ul>
    </main>
  </body>
</html>
