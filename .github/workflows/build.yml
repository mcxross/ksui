name: Build

on:
  push:
    branches: [ "main", "snapshot" ]
  pull_request:
    branches: [ "main", "snapshot" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    # JVM tests only; fastkrypto-jvm ships Linux natives, so this does not need a macOS runner.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Konan
        uses: ./.github/actions/cache-konan

      - name: Cache Gradle
        uses: ./.github/actions/cache-gradle

      - name: Grant Permission to Execute Gradle
        run: chmod +x ./gradlew
        shell: bash

      - name: Build with Gradle
        run: ./gradlew :ksui-core:jvmTest :ksui:jvmTest :ksui-grpc:jvmTest
        shell: bash

  suikit:
    name: SuiKit
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Konan
        uses: ./.github/actions/cache-konan

      - name: Cache Gradle
        uses: ./.github/actions/cache-gradle

      - name: Build the SuiKit archives
        run: |
          chmod +x ./gradlew
          ./gradlew :suikit:zipSuiKitXCFramework
        shell: bash

      - name: Test SuiKit from Swift
        run: swift test --package-path suikit/swift-smoke
        env:
          SUIKIT_LOCAL_BUILD: '1'
