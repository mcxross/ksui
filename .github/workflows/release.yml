name: Release

on:
  push:
    branches: [ main, snapshot ]

jobs:
  release:
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/snapshot'
    environment: Sonatype
    env:
      EXPECTED_RELEASE_SHA: ${{ github.sha }}
    outputs:
      released: ${{ steps.publish.outputs.released }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permissions to publish script
        run: chmod +x ./scripts/release

      - name: Verify release routing
        shell: bash
        run: bash ./scripts/release_test

      - name: Publish
        id: publish
        shell: bash
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SONATYPE_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SONATYPE_SIGNING_KEY_PASSWORD }}
        run: ./scripts/release

  suikit:
    name: Release SuiKit
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Konan
        uses: ./.github/actions/cache-konan

      - name: Cache Gradle
        uses: ./.github/actions/cache-gradle

      - name: Publish SuiKit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x ./gradlew ./scripts/release_suikit
          ./scripts/release_suikit
